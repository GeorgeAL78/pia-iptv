# pia-iptv: m3u-editor with a built-in PIA VPN and kill switch, in one container.
#
# Everything m3u-editor does online (playlist and guide syncs, proxied streams, logos
# when the logo proxy is on) uses the VPN. If the tunnel drops, that traffic stops
# instead of falling back to your regular connection.
#
# cp .env.example .env, fill it in, then: docker compose up -d
# Web UI and Xtream server: http://<docker-host-ip>:36400

name: pia-iptv

services:
  pia-iptv:
    image: ${PIA_IPTV_IMAGE:-gjergjk/pia-iptv:latest}
    build: .
    container_name: pia-iptv
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    environment:
      PIA_USERNAME: ${PIA_USERNAME:-}
      PIA_PASSWORD: ${PIA_PASSWORD:-}
      PIA_REGION: ${PIA_REGION:-us-newjersey}
      VPN_CLIENT: ${VPN_CLIENT:-wireguard}
      LAN_NETWORK: ${LAN_NETWORK:-}
      APP_URL: ${APP_URL}
      # true = no web login: anyone allowed by LAN_NETWORK gets admin. Xtream logins are unaffected.
      AUTO_LOGIN: ${M3U_AUTO_LOGIN:-false}
      # Optional: generated on first start and kept in ./data if left empty.
      PG_PASSWORD: ${PG_PASSWORD:-}
      M3U_PROXY_TOKEN: ${M3U_PROXY_TOKEN:-}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "36400:36400/tcp"
    volumes:
      - ./data:/var/www/config
      - ./pgdata:/var/lib/postgresql/data
      - ./storage:/var/www/html/storage/app/public
    restart: unless-stopped
